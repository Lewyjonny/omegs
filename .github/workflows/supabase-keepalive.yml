# Free Supabase projects pause after a week without activity; this makes a tiny read every 3 days.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one active service
        env:
          SUPABASE_URL: https://xqirplrapdetueyftxvh.supabase.co
          # Publishable (public) key, the same one shipped in the website.
          SUPABASE_KEY: sb_publishable_PxVHKusEGzaJKh8OR4wQIw_FM005MB8
        run: |
          curl --fail --silent --show-error "$SUPABASE_URL/rest/v1/services?select=id&limit=1" -H "apikey: $SUPABASE_KEY"
