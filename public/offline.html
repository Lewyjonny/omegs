<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12233a" />
    <title>Omegs: you're offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #12233a; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: #c3d4e1; max-width: 22rem; line-height: 1.5; }
      button { margin-top: 16px; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 600; background: #4fc199; color: #12233a; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Omegs needs an internet connection to show services and bookings. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
